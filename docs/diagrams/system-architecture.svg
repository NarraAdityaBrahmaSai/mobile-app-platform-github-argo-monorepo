<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f7fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d} .b{stroke:#78909c;stroke-width:2;rx:12;ry:12} .t{font-size:22px;font-weight:700} .s{font-size:16px}.a{stroke:#547080;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#547080"/></marker></defs><text x="45" y="45" class="t">Mobile Platform — Monorepo Architecture</text><rect x="40" y="80" width="185" height="90" class="b" fill="#eaf2f8"/><text x="132" y="115" text-anchor="middle" class="t">Developer</text><text x="132" y="143" text-anchor="middle" class="s">PR / tag</text><rect x="280" y="65" width="220" height="120" class="b" fill="#e8f5e9"/><text x="390" y="100" text-anchor="middle" class="t">GitHub</text><text x="390" y="128" text-anchor="middle" class="s">Main dispatcher</text><text x="390" y="153" text-anchor="middle" class="s">Reusable pipelines</text><path d="M225 125 L280 125" class="a"/><rect x="555" y="65" width="215" height="120" class="b" fill="#fff3e0"/><text x="662" y="100" text-anchor="middle" class="t">AWS Artifacts</text><text x="662" y="128" text-anchor="middle" class="s">ECR • S3</text><text x="662" y="153" text-anchor="middle" class="s">CloudFront</text><path d="M500 125 L555 125" class="a"/><rect x="825" y="65" width="290" height="120" class="b" fill="#f3e5f5"/><text x="970" y="100" text-anchor="middle" class="t">GitOps</text><text x="970" y="128" text-anchor="middle" class="s">platform/ desired state</text><text x="970" y="153" text-anchor="middle" class="s">PR + merge</text><path d="M770 125 L825 125" class="a"/><rect x="330" y="275" width="540" height="140" class="b" fill="#e0f2f1"/><text x="600" y="315" text-anchor="middle" class="t">Argo CD + Amazon EKS</text><text x="600" y="345" text-anchor="middle" class="s">Backend • Ingress • External Secrets • Observability</text><text x="600" y="373" text-anchor="middle" class="s">HPA • PDB • NetworkPolicy</text><path d="M970 185 L770 305" class="a"/><rect x="70" y="455" width="270" height="70" class="b" fill="#fce4ec"/><text x="205" y="498" text-anchor="middle" class="t">Aurora PostgreSQL</text><rect x="465" y="455" width="270" height="70" class="b" fill="#fce4ec"/><text x="600" y="498" text-anchor="middle" class="t">ElastiCache Redis</text><rect x="860" y="455" width="270" height="70" class="b" fill="#f1f8e9"/><text x="995" y="498" text-anchor="middle" class="t">Observability</text><path d="M475 415 L290 455" class="a"/><path d="M600 415 L600 455" class="a"/><path d="M725 415 L900 455" class="a"/><text x="45" y="550" class="s">Production Kubernetes access is GitOps-controlled; normal application CI does not require kubectl access to EKS.</text></svg>