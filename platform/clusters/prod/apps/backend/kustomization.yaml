apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - external-secret.yaml
  - ingress.yaml
  - servicemonitor.yaml
commonLabels:
  app.kubernetes.io/name: backend
  app.kubernetes.io/part-of: mobile-platform
images:
  - name: BACKEND_IMAGE
    newName: REPLACE_WITH_ECR_REPOSITORY
    digest: REPLACE_WITH_IMAGE_DIGEST
