apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend
  namespace: product
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /prod/mobile-platform/backend
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: /prod/mobile-platform/backend
        property: REDIS_URL
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: /prod/mobile-platform/backend
        property: JWT_SIGNING_KEY
