
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: aws-load-balancer-controller, namespace: argocd}
spec:
  project: product
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.14.0
    helm:
      valuesObject:
        clusterName: REPLACE_WITH_EKS_CLUSTER_NAME
        region: ap-south-1
        vpcId: REPLACE_WITH_VPC_ID
        serviceAccount: {create: false, name: aws-load-balancer-controller}
  destination: {server: https://kubernetes.default.svc, namespace: ingress-system}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: external-secrets, namespace: argocd}
spec:
  project: product
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.20.2
    helm:
      valuesObject: {installCRDs: true, serviceAccount: {create: false, name: external-secrets}}
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets-system}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: kube-prometheus-stack, namespace: argocd}
spec:
  project: product
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 77.10.0
    helm:
      valuesObject:
        grafana: {enabled: true}
        prometheus: {prometheusSpec: {retention: 15d}}
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: opentelemetry-collector, namespace: argocd}
spec:
  project: product
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.142.0
    helm:
      valuesObject:
        mode: deployment
        config:
          receivers: {otlp: {protocols: {grpc: {}, http: {}}}}
          processors: {batch: {}}
          exporters: {debug: {}}
          service: {pipelines: {traces: {receivers: [otlp], processors: [batch], exporters: [debug]}}}
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
