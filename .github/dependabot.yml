version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /app/backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
  - package-ecosystem: bundler
    directory: /app/android
    schedule:
      interval: weekly
