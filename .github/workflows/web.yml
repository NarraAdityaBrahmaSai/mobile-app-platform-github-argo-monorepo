name: Web Pipeline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/web/package.json
      - working-directory: app/web
        run: npm ci
      - working-directory: app/web
        run: npm test

  build-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/web/package.json
      - working-directory: app/web
        run: npm ci
      - working-directory: app/web
        env:
          RELEASE_ID: ${{ github.sha }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-web-${{ github.run_id }}
      - run: |
          aws s3 sync app/web/dist/assets/ "s3://${{ vars.WEB_BUCKET }}/releases/${GITHUB_SHA}/assets/" --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp app/web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" --cache-control 'no-cache,no-store,must-revalidate' --content-type 'text/html; charset=utf-8'
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/index.html'
