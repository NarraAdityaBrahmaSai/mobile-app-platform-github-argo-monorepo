name: Security Pipeline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  python-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: python -m pip install --upgrade pip-audit
      - name: pip-audit
        run: pip-audit -r app/backend/requirements.txt

  terraform-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true

  public-repo-sanity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-public-repo.sh
