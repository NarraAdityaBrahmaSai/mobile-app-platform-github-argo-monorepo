name: Backend Pipeline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: mobile-platform/backend

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: python -m pip install -r app/backend/requirements.lock
      - run: python -m compileall app/backend

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - run: python -m pip install -r app/backend/requirements.lock
      - run: pytest -q app/backend/tests --junitxml=app/backend/test-results.xml
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: app/backend/test-results.xml

  build-scan-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, test]
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ecr-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --pull \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            app/backend
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: backend-sbom.json
      - name: Push image and resolve digest
        id: publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$digest" && test "$digest" != None
          echo "image_ref=${REGISTRY}/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: backend-sbom
          path: backend-sbom.json

  gitops-promotion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-publish
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_REF: ${{ needs.build-scan-publish.outputs.image_ref }}
          PLATFORM_REPOSITORY: ${{ github.repository }}
        run: ./scripts/promote-gitops.sh "$IMAGE_REF" prod
